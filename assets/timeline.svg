  </linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22D3EE" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#1F2A4D"/>
